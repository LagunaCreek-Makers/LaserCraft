name: LaserCraft build and tests
on:
  push:
    paths:
      - 'apps/vectorcraft/**'
      - 'apps/lasercraft-cli/**'
      - 'crates/lasercraft-core/**'
      - 'tools/lasercraft_calibrate.py'
      - 'tools/tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lasercraft-validation.yml'
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev libasound2-dev libgtk-3-dev
      - name: Check LaserCraft core
        run: cargo check -p lasercraft-core --locked
      - name: Test LaserCraft core
        run: cargo test -p lasercraft-core --locked
      - name: Check VectorCraft desktop integration
        run: cargo check -p vectorcraft --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (LaserCraft packages)
        run: cargo clippy -p vectorcraft -p lasercraft-core -p lasercraft-cli --all-targets --locked -- -D warnings
      - name: Test desktop app and LaserCraft CLI
        run: cargo test -p vectorcraft -p lasercraft-cli --locked
      - name: Build desktop release
        run: cargo build --release -p vectorcraft --locked
      - name: Upload compiled desktop executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lasercraft-linux-desktop
          path: target/release/vectorcraft
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q tools/lasercraft_calibrate.py tools/tests
      - run: python -m unittest discover -s tools/tests -v
